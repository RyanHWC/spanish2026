<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year 9 Spanish - Full Vocab Mastery</title>
    <style>
        :root {
            --bg-color: #F7F9FC;
            --card-bg: #FFFFFF;
            --primary: #58CC02;
            --primary-shadow: #46A302;
            --secondary: #1CB0F6;
            --secondary-shadow: #1899D6;
            --purple: #CE82FF;
            --purple-shadow: #A568CC;
            --text-main: #4B4B4B;
            --text-light: #777777;
            --border-color: #E5E5E5;
            --error: #FF4B4B;
            --error-shadow: #EA2B2B;
        }

        body {
            font-family: 'Nunito', 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            padding-bottom: 3rem;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 2px solid var(--border-color);
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            margin-bottom: 2rem;
        }

        header h1 {
            margin: 0;
            color: var(--primary);
            font-size: 2rem;
            font-weight: 800;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            padding: 0 1rem;
        }

        .nav-btn {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-bottom: 4px solid var(--border-color);
            color: var(--text-light);
            padding: 1rem 1.5rem;
            border-radius: 1rem;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.1s;
        }

        .nav-btn:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
            margin-top: 2px;
        }

        .nav-btn.active {
            border-color: var(--secondary);
            border-bottom-color: var(--secondary-shadow);
            color: var(--secondary);
        }

        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .section-content {
            display: none;
            background: var(--card-bg);
            border-radius: 1.5rem;
            border: 2px solid var(--border-color);
            padding: 2rem;
            box-shadow: 0 8px 0 var(--border-color);
        }

        .section-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .unit-selector {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .unit-tab {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-bottom: 4px solid var(--border-color);
            padding: 0.75rem 1.25rem;
            border-radius: 1rem;
            font-weight: 700;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.1s;
        }

        .unit-tab:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        .unit-tab.active {
            border-color: var(--purple);
            border-bottom-color: var(--purple-shadow);
            color: var(--purple);
        }

        /* Flashcards */
        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            height: 250px;
            margin: 2rem 0;
            cursor: pointer;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .flashcard.flipped { transform: rotateY(180deg); }

        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            font-weight: 800;
            border-radius: 1.5rem;
            padding: 1.5rem;
            text-align: center;
            box-sizing: border-box;
            border: 2px solid var(--border-color);
            border-bottom: 6px solid var(--border-color);
        }

        .flashcard-front { background: var(--card-bg); color: var(--text-main); }
        .flashcard-back { background: var(--secondary); border-color: var(--secondary-shadow); color: white; transform: rotateY(180deg); }

        .btn {
            background-color: var(--primary);
            border: none;
            border-bottom: 4px solid var(--primary-shadow);
            color: white;
            padding: 1rem 2rem;
            border-radius: 1rem;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            transition: all 0.1s;
            margin-top: 1rem;
        }

        .btn:active {
            transform: translateY(4px);
            border-bottom-width: 0;
            margin-bottom: 4px;
        }

        .btn:disabled {
            background-color: #E5E5E5;
            border-bottom-color: #CECECE;
            color: #AFAFAF;
            cursor: not-allowed;
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        /* Drag & Drop Rounds */
        .round-info {
            text-align: center;
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        .matching-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 1.5rem;
        }

        .match-item {
            padding: 1rem;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-bottom: 4px solid var(--border-color);
            border-radius: 1rem;
            margin-bottom: 1rem;
            cursor: grab;
            font-weight: 700;
            text-align: center;
            color: var(--text-main);
        }
        
        .match-item:active { cursor: grabbing; }

        .drop-zone {
            padding: 1rem;
            background: var(--bg-color);
            border: 2px dashed #BDBDBD;
            border-radius: 1rem;
            margin-bottom: 1rem;
            min-height: 3rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 700;
            color: var(--text-main);
        }

        .drop-zone.drag-over {
            background: #E1F3FE;
            border-color: var(--secondary);
        }

        .drop-zone.correct {
            background: #D7FFB8;
            border: 2px solid var(--primary);
            color: var(--primary-shadow);
        }
    </style>
</head>
<body>

    <header>
        <h1>Vocab Mastery</h1>
    </header>

    <div class="nav-tabs">
        <button class="nav-btn active" onclick="switchTab('flashcards')">🃏 Flashcards</button>
        <button class="nav-btn" onclick="switchTab('dragdrop')">🧩 Drag & Drop (Rounds)</button>
    </div>

    <main>
        <!-- FLASHCARDS SECTION -->
        <section id="flashcards" class="section-content active">
            <h2 style="text-align: center; color: var(--text-main); margin-top: 0;">Study Full Vocabulary</h2>
            
            <div class="unit-selector">
                <button class="unit-tab active" onclick="setUnit(1)">Unit 1: Media</button>
                <button class="unit-tab" onclick="setUnit(2)">Unit 2: Health</button>
                <button class="unit-tab" onclick="setUnit(3)">Unit 3: House/Jobs</button>
                <button class="unit-tab" onclick="setUnit(4)">Unit 4: Tourism</button>
            </div>

            <div class="flashcard-container" onclick="flipCard()">
                <div class="flashcard" id="flashcard">
                    <div class="flashcard-face flashcard-front" id="card-front">Loading...</div>
                    <div class="flashcard-face flashcard-back" id="card-back">Loading...</div>
                </div>
            </div>

            <div class="controls-row">
                <button class="btn" style="width: 48%; background: var(--secondary); border-color: var(--secondary-shadow);" onclick="prevCard()">⬅️ Back</button>
                <button class="btn" style="width: 48%; background: var(--secondary); border-color: var(--secondary-shadow);" onclick="nextCard()">Next ➡️</button>
            </div>
            <div style="text-align: center; margin-top: 1rem; font-weight: 700; color: var(--text-light);" id="card-counter">1 / X</div>
        </section>

        <!-- DRAG AND DROP SECTION -->
        <section id="dragdrop" class="section-content">
            <h2 style="text-align: center; color: var(--text-main); margin-top: 0;">Match 5 Words Per Round</h2>
            
            <div class="unit-selector">
                <button class="unit-tab dd-tab active" onclick="setDDUnit(1)">Unit 1</button>
                <button class="unit-tab dd-tab" onclick="setDDUnit(2)">Unit 2</button>
                <button class="unit-tab dd-tab" onclick="setDDUnit(3)">Unit 3</button>
                <button class="unit-tab dd-tab" onclick="setDDUnit(4)">Unit 4</button>
            </div>

            <div class="round-info" id="round-info">Round 1</div>

            <div class="matching-grid">
                <div>
                    <h3 style="text-align: center;">Español</h3>
                    <div id="word-bank"></div>
                </div>
                <div>
                    <h3 style="text-align: center;">English</h3>
                    <div id="drop-targets"></div>
                </div>
            </div>
            
            <button class="btn" id="next-round-btn" style="display: none;" onclick="loadNextRound()">Next Round 🌟</button>
            <div id="completion-message" style="display:none; text-align:center; font-size:1.5rem; font-weight:bold; color:var(--primary); margin-top:2rem;">🎉 Unit Complete! 🎉</div>
        </section>
    </main>

    <script>
        // FULL VOCABULARY DATABASE
        const vocabDB = {
            1: [
                { s: "La batería", e: "The drums" }, { s: "El teclado", e: "The electric keyboard" }, 
                { s: "El violín", e: "The violin" }, { s: "El piano", e: "The piano" },
                { s: "La flauta", e: "The flute" }, { s: "El bajo", e: "The bass" },
                { s: "El saxofón", e: "The saxophone" }, { s: "La trompeta", e: "The trumpet" },
                { s: "La guitarra", e: "The guitar" }, { s: "El instrumento", e: "The instrument" },
                { s: "El grupo musical", e: "The music band" }, { s: "La banda", e: "The band" },
                { s: "El tipo de música", e: "The type of music" }, { s: "La televisión", e: "Television" },
                { s: "Una película", e: "A movie" }, { s: "Un programa", e: "A show" },
                { s: "Una telenovela", e: "A soap opera" }, { s: "Un concurso", e: "A game show" },
                { s: "Las noticias", e: "The news" }, { s: "Un programa infantil", e: "A children's show" },
                { s: "Una serie de comedia", e: "A comedy show" }, { s: "Un reality", e: "A reality show" },
                { s: "Un programa de deportes", e: "A sports programme" }, { s: "Un documental de animales", e: "An animal documentary" },
                { s: "Serio", e: "Serious" }, { s: "Divertido", e: "Funny" },
                { s: "Entretenido", e: "Entertaining" }, { s: "Interesante", e: "Interesting" },
                { s: "Gracioso", e: "Funny" }, { s: "Emocionante", e: "Exciting" },
                { s: "Aburrido", e: "Boring" }, { s: "Guay", e: "Cool" },
                { s: "Horrible", e: "Terrible" }, { s: "Triste", e: "Sad" },
                { s: "Los videojuegos", e: "The video games" }, { s: "Los juegos de batalla", e: "The battle games" },
                { s: "Adictivo", e: "Addictive" }, { s: "Caro", e: "Expensive" },
                { s: "Violento", e: "Violent" }, { s: "Viejo", e: "Old" }, { s: "Barato", e: "Cheap" }
            ],
            2: [
                { s: "El cuerpo", e: "The body" }, { s: "La cara", e: "The face" },
                { s: "La cabeza", e: "The head" }, { s: "La garganta", e: "The throat" },
                { s: "La espalda", e: "The back" }, { s: "La mano", e: "The hand" },
                { s: "La pierna", e: "The leg" }, { s: "La rodilla", e: "The knee" },
                { s: "Los dientes", e: "The teeth" }, { s: "El estómago", e: "The stomach" },
                { s: "El brazo", e: "The arm" }, { s: "El pie", e: "The foot" },
                { s: "El dedo", e: "The finger" }, { s: "Los oídos", e: "The ears" },
                { s: "La boca", e: "The mouth" }, { s: "La nariz", e: "The nose" },
                { s: "El ojo", e: "The eye" }, { s: "¿Qué te pasa?", e: "What's the matter?" },
                { s: "Me duele la cabeza", e: "I have a headache" }, { s: "Me siento mal", e: "I feel awful" },
                { s: "Tengo una insolación", e: "I have sunstroke" }, { s: "Tengo la pierna rota", e: "I have a broken leg" },
                { s: "Tengo tos", e: "I have a cough" }, { s: "Tengo fiebre", e: "I have a fever" },
                { s: "Tengo una picadura", e: "I have a bite" }, { s: "Tengo gripe", e: "I've got a flu" },
                { s: "Estoy mareado", e: "I am dizzy" }, { s: "Tengo diarrea", e: "I have diarrhea" },
                { s: "La crema antiséptica", e: "Antiseptic cream" }, { s: "Las aspirinas", e: "Aspirins" },
                { s: "Las pastillas", e: "Tablets" }, { s: "Las tiritas", e: "Plasters" },
                { s: "El jarabe", e: "Syrup" }, { s: "¿Qué debo hacer?", e: "What should I do?" }
            ],
            3: [
                { s: "Un chalet", e: "A villa" }, { s: "Una casa", e: "A house" },
                { s: "Una granja", e: "A farmhouse" }, { s: "Una cabaña", e: "A cabin" },
                { s: "Una mansión", e: "A mansion" }, { s: "Un ático dúplex", e: "A penthouse" },
                { s: "Un apartamento", e: "An apartment" }, { s: "En una ciudad grande", e: "In a big city" },
                { s: "Cerca de la playa", e: "Near the beach" }, { s: "En el campo", e: "In the country" },
                { s: "Espacioso", e: "Spacious" }, { s: "Acogedor", e: "Cozy" },
                { s: "Moderno", e: "Modern" }, { s: "Encantador", e: "Charming" },
                { s: "Elegante", e: "Elegant" }, { s: "Rústico", e: "Rustic" },
                { s: "Un jardín", e: "A garden" }, { s: "Una piscina", e: "A pool" },
                { s: "Ambicioso", e: "Ambitious" }, { s: "Creativo", e: "Creative" },
                { s: "Independiente", e: "Independent" }, { s: "Inteligente", e: "Intelligent" },
                { s: "Paciente", e: "Patient" }, { s: "Trabajador", e: "Hard-working" },
                { s: "Abogado/a", e: "Lawyer" }, { s: "Cantante", e: "Singer" },
                { s: "Diseñador/a", e: "Designer" }, { s: "Enfermero/a", e: "Nurse" },
                { s: "Mecánico/a", e: "Mechanic" }, { s: "Periodista", e: "Journalist" },
                { s: "Policía", e: "Police officer" }, { s: "Jardinero/a", e: "Gardener" },
                { s: "Médico/a", e: "Doctor" }, { s: "Cocinero/a", e: "Chef" },
                { s: "Profesor/a", e: "Teacher" }, { s: "Difícil", e: "Difficult" },
                { s: "Estresante", e: "Stressful" }, { s: "Monótono", e: "Monotonous" }
            ],
            4: [
                { s: "A España", e: "To Spain" }, { s: "A la costa", e: "To the coast" },
                { s: "A la sierra", e: "To the mountains" }, { s: "Al campo", e: "To the countryside" },
                { s: "En coche", e: "By car" }, { s: "En avión", e: "By plane" },
                { s: "En tren", e: "By train" }, { s: "En autocar", e: "By coach" },
                { s: "En ferry", e: "By ferry" }, { s: "En un hotel", e: "In a hotel" },
                { s: "En un camping", e: "In a campsite" }, { s: "Una catedral", e: "A cathedral" },
                { s: "Un castillo", e: "A castle" }, { s: "Un museo", e: "A museum" },
                { s: "El estadio", e: "The stadium" }, { s: "Mi hermana", e: "My sister" },
                { s: "Mi primo", e: "My cousin" }, { s: "Una camiseta", e: "A T-shirt" },
                { s: "Una gorra", e: "A baseball cap" }, { s: "Unas gafas de sol", e: "Sunglasses" },
                { s: "En el mar", e: "In the sea" }, { s: "En la piscina", e: "In the swimming pool" },
                { s: "En el lago", e: "In the lake" }, { s: "Muy bien", e: "Really good" },
                { s: "Fenomenal", e: "Great" }, { s: "¡Lo pasé bomba!", e: "I had a blast!" },
                { s: "Ayer", e: "Yesterday" }, { s: "El lunes", e: "On Monday" },
                { s: "El año pasado", e: "Last year" }, { s: "La semana pasada", e: "Last week" },
                { s: "A la discoteca", e: "To the club" }, { s: "A la playa", e: "To the beach" },
                { s: "Al parque", e: "To the park" }, { s: "Al centro comercial", e: "To the shopping centre" },
                { s: "Tomé el sol", e: "I sunbathed" }, { s: "Saqué fotos", e: "I took photos" },
                { s: "Monté en bicicleta", e: "I went cycling" }, { s: "Hice surf", e: "I went surfing" },
                { s: "Un parque temático", e: "A theme park" }
            ]
        };

        // UI TABS
        function switchTab(tabId) {
            document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        // FLASHCARD LOGIC
        let currentUnit = 1;
        let cardIndex = 0;
        let isFlipped = false;

        function setUnit(unit) {
            currentUnit = unit;
            cardIndex = 0;
            isFlipped = false;
            document.querySelectorAll('#flashcards .unit-tab').forEach((t, i) => {
                t.classList.toggle('active', i + 1 === unit);
            });
            updateCard();
        }

        function updateCard() {
            const card = vocabDB[currentUnit][cardIndex];
            document.getElementById('card-front').innerText = card.s;
            document.getElementById('card-back').innerText = card.e;
            document.getElementById('flashcard').classList.remove('flipped');
            isFlipped = false;
            document.getElementById('card-counter').innerText = `${cardIndex + 1} / ${vocabDB[currentUnit].length}`;
        }

        function flipCard() {
            isFlipped = !isFlipped;
            document.getElementById('flashcard').classList.toggle('flipped', isFlipped);
        }

        function nextCard() {
            cardIndex = (cardIndex + 1) % vocabDB[currentUnit].length;
            updateCard();
        }

        function prevCard() {
            cardIndex = (cardIndex - 1 + vocabDB[currentUnit].length) % vocabDB[currentUnit].length;
            updateCard();
        }

        // DRAG & DROP LOGIC (5-WORD ROUNDS)
        let ddCurrentUnit = 1;
        let ddShuffledList = [];
        let currentRoundIndex = 0;
        let itemsPerRound = 5;
        let matchesInRound = 0;

        function setDDUnit(unit) {
            ddCurrentUnit = unit;
            document.querySelectorAll('.dd-tab').forEach((t, i) => {
                t.classList.toggle('active', i + 1 === unit);
            });
            
            // Clone and shuffle unit array
            ddShuffledList = [...vocabDB[ddCurrentUnit]].sort(() => Math.random() - 0.5);
            currentRoundIndex = 0;
            
            document.getElementById('completion-message').style.display = 'none';
            document.getElementById('next-round-btn').style.display = 'none';
            document.querySelector('.matching-grid').style.display = 'grid';
            
            loadNextRound(true);
        }

        function loadNextRound(isFirst = false) {
            if (!isFirst) {
                currentRoundIndex += itemsPerRound;
            }

            if (currentRoundIndex >= ddShuffledList.length) {
                document.querySelector('.matching-grid').style.display = 'none';
                document.getElementById('next-round-btn').style.display = 'none';
                document.getElementById('completion-message').style.display = 'block';
                document.getElementById('round-info').innerText = "All Words Matched!";
                return;
            }

            document.getElementById('next-round-btn').style.display = 'none';
            matchesInRound = 0;

            const currentRoundMax = Math.min(currentRoundIndex + itemsPerRound, ddShuffledList.length);
            const currentRoundItems = ddShuffledList.slice(currentRoundIndex, currentRoundMax);
            
            document.getElementById('round-info').innerText = `Round ${(currentRoundIndex/itemsPerRound) + 1} of ${Math.ceil(ddShuffledList.length/itemsPerRound)}`;

            const wordBank = document.getElementById('word-bank');
            const dropTargets = document.getElementById('drop-targets');
            wordBank.innerHTML = '';
            dropTargets.innerHTML = '';

            let shuffledSpanish = [...currentRoundItems].sort(() => Math.random() - 0.5);
            let shuffledEnglish = [...currentRoundItems].sort(() => Math.random() - 0.5);

            shuffledSpanish.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = 'match-item';
                div.draggable = true;
                div.innerText = item.s;
                // Use the english text as the unique ID for matching
                div.dataset.matchId = item.e; 

                div.addEventListener('dragstart', e => {
                    e.dataTransfer.setData('text/plain', item.e);
                });
                wordBank.appendChild(div);
            });

            shuffledEnglish.forEach((item) => {
                const zone = document.createElement('div');
                zone.className = 'drop-zone';
                zone.innerText = item.e;
                zone.dataset.targetId = item.e;

                zone.addEventListener('dragover', e => {
                    e.preventDefault();
                    if(!zone.classList.contains('correct')) zone.classList.add('drag-over');
                });

                zone.addEventListener('dragleave', () => {
                    zone.classList.remove('drag-over');
                });

                zone.addEventListener('drop', e => {
                    e.preventDefault();
                    zone.classList.remove('drag-over');
                    
                    if(zone.classList.contains('correct')) return; // Already answered

                    const draggedId = e.dataTransfer.getData('text/plain');
                    if(draggedId === zone.dataset.targetId) {
                        // Correct Match
                        zone.classList.add('correct');
                        zone.innerHTML = `${item.e} <span style="font-size:1.5rem">✅</span>`;
                        
                        // Hide dragged item
                        const draggedElement = document.querySelector(`[data-match-id="${draggedId}"]`);
                        if(draggedElement) draggedElement.style.visibility = 'hidden';
                        
                        matchesInRound++;
                        if(matchesInRound === currentRoundItems.length) {
                            document.getElementById('next-round-btn').style.display = 'block';
                        }
                    } else {
                        // Incorrect Match visual feedback
                        zone.style.borderColor = "var(--error)";
                        setTimeout(() => { zone.style.borderColor = "#BDBDBD"; }, 500);
                    }
                });

                dropTargets.appendChild(zone);
            });
        }

        // Initialize on page load
        window.onload = () => {
            updateCard();
            setDDUnit(1);
        };
    </script>
</body>
</html>
